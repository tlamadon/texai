[project]
name = "texai"
version = "0.1.0"
description = "A canvas for LaTeX: read the compiled PDF, point at a passage, and a coding agent edits the source and rebuilds it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[project.scripts]
texai = "texai.cli:main"

[project.optional-dependencies]
# The chat panel needs this; the viewer and SyncTeX bridge do not.
agent = ["claude-agent-sdk>=0.2"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/texai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

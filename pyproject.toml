[project]
name = "texai"
# Single-sourced from src/texai/__init__.py, so a release cannot ship a
# package whose reported version disagrees with its metadata.
dynamic = ["version"]
description = "Overleaf, but local: the compiled PDF, your coding agent, your disk, and any git remote."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["latex", "pdf", "synctex", "agent", "claude", "editing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "claude-agent-sdk>=0.2.138",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/tlamadon/texai"
Repository = "https://github.com/tlamadon/texai"

[project.scripts]
texai = "texai.cli:main"

[project.optional-dependencies]
# The agent SDK is a plain dependency now. This extra is kept so that the
# `texai[agent]` install line already published in 0.1.0 keeps working.
agent = []

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/texai/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/texai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
